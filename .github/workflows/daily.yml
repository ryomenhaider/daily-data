name: Daily Intelligence Pipeline

on:
  schedule:
    # 08:00 PKT
    - cron: "0 3 * * *"

    # 14:00 PKT
    - cron: "0 9 * * *"

    # 20:00 PKT
    - cron: "0 15 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: daily-intelligence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pipeline:
    name: Collect and publish intelligence
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # PYTHON PATH
      # ============================================================

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      # ============================================================
      # GIT
      # ============================================================

      - name: Configure Git
        run: |
          # Use the triggering user's identity so contributions count
          # toward their GitHub profile, not the github-actions bot.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      # ============================================================
      # GENERATE UNIQUE RUN ID
      # ============================================================

      - name: Generate run identifiers
        id: run
        run: |
          RUN_ID="$(date -u '+%Y-%m-%d-%H-%M-%S')"
          BRANCH="automation/run/${RUN_ID}"

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "RUN ID: ${RUN_ID}"
          echo "BRANCH: ${BRANCH}"
          echo "=========================================="

      # ============================================================
      # CREATE BRANCH
      # ============================================================

      - name: Create run branch
        run: |
          git checkout -b "${{ steps.run.outputs.branch }}"

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ============================================================
      # VERIFY DEPENDENCIES
      # ============================================================

      - name: Verify Python environment
        run: |
          python --version
          python -c "import requests; print('requests:', requests.__version__)"
          python -c "import pytest; print('pytest:', pytest.__version__)"
          python -c "import src; print('src:', src.__file__)"

      # ============================================================
      # TESTS BEFORE PIPELINE
      # ============================================================

      - name: Run tests before pipeline
        run: |
          python -m pytest -q

      # ============================================================
      # RUN INTELLIGENCE PIPELINE
      # ============================================================

      - name: Run daily intelligence pipeline
        run: |
          python -m src.daily_pipeline

      # ============================================================
      # VALIDATE GENERATED OUTPUT
      # ============================================================

      - name: Validate generated output
        run: |
          python -m pytest -q

      # ============================================================
      # SHOW GENERATED COMMITS
      # ============================================================

      - name: Show generated commits
        run: |
          echo "=========================================="
          echo "GENERATED COMMITS"
          echo "=========================================="

          git log --oneline -20

          echo ""
          echo "=========================================="
          echo "CHANGED FILES"
          echo "=========================================="

          git status --short

      # ============================================================
      # PUSH RUN BRANCH
      # ============================================================

      - name: Push run branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Use a Personal Access Token (GH_PAT) stored in repository secrets
          # so the action can create branches and PRs even when the
          # default GITHUB_TOKEN lacks the required permissions.
          git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git push \
            --set-upstream \
            origin \
            "${{ steps.run.outputs.branch }}"

      # ============================================================
      # CREATE PULL REQUEST
      # ============================================================

      - name: Create pull request
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          BRANCH="${{ steps.run.outputs.branch }}"
          # Authenticate gh with the PAT for CLI operations
          gh auth login --with-token <<< "${GH_PAT}"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "data: intelligence pipeline ${RUN_ID}" \
            --body "## Automated Intelligence Pipeline

          **Run ID:** ${RUN_ID}

          ### Data Sources

          - CoinPaprika
          - Frankfurter
          - Open-Meteo
          - World Bank

          ### Generated Data

          - Cryptocurrency snapshot
          - Foreign exchange snapshot
          - Weather snapshot
          - Macroeconomic snapshot

          ### Generated Features

          - Cryptocurrency features
          - FX features
          - Weather features
          - Combined daily feature set

          ### Generated Artifacts

          - Raw datasets
          - Feature datasets
          - Intelligence report
          - Pipeline metadata

          ### Validation

          - Tests executed before collection
          - API responses validated
          - Generated data validated
          - Tests executed after collection

          This PR was generated automatically by GitHub Actions."

      # ============================================================
      # MERGE PULL REQUEST
      # ============================================================

      - name: Merge pull request
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Merge into the default branch so all 10 generated commits
          # count toward the contribution graph. A squash merge would
          # collapse them into one commit and abandon the rest.
          gh pr merge \
            "${{ steps.run.outputs.branch }}" \
            --merge \
            --delete-branch

      # ============================================================
      # CREATE DATA QUALITY ISSUE
      # ============================================================

      - name: Create data quality issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "data: quality review ${RUN_ID}" \
            --body "## Daily Data Quality Review

          **Pipeline Run:** ${RUN_ID}

          ### Checks

          - [ ] Cryptocurrency API response valid
          - [ ] FX API response valid
          - [ ] Weather API response valid
          - [ ] World Bank response valid
          - [ ] No unexpected null values
          - [ ] Feature calculations valid
          - [ ] Generated report valid
          - [ ] Pipeline metadata valid

          ### Sources

          - CoinPaprika
          - Frankfurter
          - Open-Meteo
          - World Bank

          This issue was generated automatically for traceability."

      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Pipeline summary
        run: |
          echo "=========================================="
          echo "PIPELINE COMPLETED"
          echo "=========================================="
          echo "Run ID: ${{ steps.run.outputs.run_id }}"
          echo "Branch: ${{ steps.run.outputs.branch }}"
          echo "Repository: ${{ github.repository }}"
          echo "=========================================="
