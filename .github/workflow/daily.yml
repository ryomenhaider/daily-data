name: Daily Intelligence Pipeline

on:
  
  schedule:

    # 8 AM PKT
    - cron: "0 3 * * *"

    # 2 PM PKT
    - cron: "0 9 * * *"

    # 8 PM PKT
    - cron: "0 15 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Prevent two daily pipelines from running simultaneously.
concurrency:
  group: daily-intelligence-pipeline
  cancel-in-progress: false

jobs:

  collect:
    name: Collect and publish daily data
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "rankistan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create daily branch
        run: |
          DATE=$(date -u +%Y-%m-%d)

          BRANCH="automation/daily/${DATE}"

          echo "Creating branch: $BRANCH"

          git checkout -B "$BRANCH"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests before pipeline
        run: |
          pytest -q

      - name: Run daily pipeline
        run: |
          python src/daily_pipeline.py

      - name: Validate generated data
        run: |
          pytest -q

      - name: Show daily commits
        run: |
          echo "=========================================="
          echo "Generated commits:"
          echo "=========================================="

          git log \
            --oneline \
            --decorate \
            -15

      - name: Push daily branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          DATE=$(date -u +%Y-%m-%d)

          BRANCH="automation/daily/${DATE}"

          echo "Pushing $BRANCH"

          git push \
            --set-upstream \
            origin \
            "$BRANCH"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          DATE=$(date -u +%Y-%m-%d)

          BRANCH="automation/daily/${DATE}"

          EXISTING=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -eq 0 ]; then

            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "data: daily intelligence snapshot — ${DATE}" \
              --body "$(cat <<EOF

          ## Daily Intelligence Pipeline

          Automated data collection for **${DATE}**.

          ### Sources

          - CoinPaprika
          - Frankfurter
          - Open-Meteo
          - World Bank

          ### Generated

          - cryptocurrency snapshot
          - FX snapshot
          - weather snapshot
          - macroeconomic snapshot
          - crypto features
          - FX features
          - weather features
          - combined feature set
          - intelligence report
          - pipeline metadata

          ### Validation

          Automated tests passed before and after data generation.

          EOF
          )"

          else

            echo "An open PR already exists for ${DATE}."

          fi

      - name: Create data quality issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          DATE=$(date -u +%Y-%m-%d)

          EXISTING=$(gh issue list \
            --search "\"Daily data quality review — ${DATE}\" in:title" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING" -eq 0 ]; then

            gh issue create \
              --title "Daily data quality review — ${DATE}" \
              --body "$(cat <<EOF

          # Daily Data Quality Review

          Automated snapshot generated for **${DATE}**.

          ## Review

          - [ ] Cryptocurrency API response valid
          - [ ] FX response valid
          - [ ] Weather response valid
          - [ ] World Bank response valid
          - [ ] No unexpected null values
          - [ ] Feature calculations valid
          - [ ] Report generated successfully

          ## Sources

          - CoinPaprika
          - Frankfurter
          - Open-Meteo
          - World Bank

          EOF
          )"

          else

            echo "Issue already exists for ${DATE}."

          fi