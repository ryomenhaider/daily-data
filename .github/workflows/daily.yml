name: Daily Intelligence Pipeline

on:

  # ==============================================================
  # AUTOMATIC SCHEDULE
  # ==============================================================

  schedule:

    # 08:00 PKT
    # 03:00 UTC
    - cron: "0 3 * * *"

    # 14:00 PKT
    # 09:00 UTC
    - cron: "0 9 * * *"

    # 20:00 PKT
    # 15:00 UTC
    - cron: "0 15 * * *"

  # ==============================================================
  # MANUAL EXECUTION
  # ==============================================================

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Prevent two executions from running simultaneously.
concurrency:
  group: daily-intelligence-${{ github.ref }}
  cancel-in-progress: false


jobs:

  pipeline:

    name: Run intelligence pipeline

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # GIT CONFIG
      # ============================================================

      - name: Configure Git

        run: |

          git config user.name "rankistan-bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================================
      # CREATE UNIQUE RUN ID
      # ============================================================

      - name: Generate run identifiers

        id: run

        run: |

          DATE=$(date -u +"%Y-%m-%d")

          TIME=$(date -u +"%H-%M-%S")

          RUN_ID="${DATE}-${TIME}"

          BRANCH="automation/run/${RUN_ID}"

          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

          echo "time=${TIME}" >> "$GITHUB_OUTPUT"

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          echo "======================================"

          echo "RUN ID:  ${RUN_ID}"

          echo "BRANCH:  ${BRANCH}"

          echo "======================================"


      # ============================================================
      # CREATE UNIQUE BRANCH BEFORE PIPELINE
      # ============================================================

      - name: Create run branch

        run: |

          git checkout -B \
            "${{ steps.run.outputs.branch }}"


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

          cache: pip


      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ============================================================
      # TEST BEFORE PIPELINE
      # ============================================================

      - name: Run tests

        run: |

          pytest -q


      # ============================================================
      # RUN PIPELINE
      # ============================================================

      - name: Run daily pipeline

        run: |

          python src/daily_pipeline.py


      # ============================================================
      # TEST GENERATED DATA
      # ============================================================

      - name: Validate generated pipeline

        run: |

          pytest -q


      # ============================================================
      # SHOW COMMITS
      # ============================================================

      - name: Show generated commits

        run: |

          echo "======================================"

          echo "GENERATED COMMITS"

          echo "======================================"

          git log \
            --oneline \
            --decorate \
            -15


      # ============================================================
      # PUSH BRANCH
      # ============================================================

      - name: Push run branch

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          git push \
            --set-upstream \
            origin \
            "${{ steps.run.outputs.branch }}"


      # ============================================================
      # CREATE PR
      # ============================================================

      - name: Create pull request

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          BRANCH="${{ steps.run.outputs.branch }}"

          RUN_ID="${{ steps.run.outputs.run_id }}"

          gh pr create \

            --base main \

            --head "$BRANCH" \

            --title \
            "data: intelligence pipeline ${RUN_ID}" \

            --body "$(cat <<EOF

          ## Automated Intelligence Pipeline

          **Run:** ${RUN_ID}

          ### Data sources

          - CoinPaprika
          - Frankfurter
          - Open-Meteo
          - World Bank

          ### Generated

          - cryptocurrency snapshot
          - FX snapshot
          - weather snapshot
          - macroeconomic snapshot
          - crypto features
          - FX features
          - weather features
          - combined features
          - intelligence report
          - pipeline metadata

          ### Validation

          - Tests executed before collection
          - API responses validated
          - Generated data validated
          - Tests executed after collection

          EOF
          )"


      # ============================================================
      # CREATE ISSUE
      # ============================================================

      - name: Create data quality issue

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          RUN_ID="${{ steps.run.outputs.run_id }}"

          gh issue create \

            --title \
            "data: quality review ${RUN_ID}" \

            --body "$(cat <<EOF

          # Data Quality Review

          Automated pipeline run:

          **${RUN_ID}**

          ## Review

          - [ ] Cryptocurrency data valid
          - [ ] FX data valid
          - [ ] Weather data valid
          - [ ] Macro data valid
          - [ ] No unexpected null values
          - [ ] Feature calculations valid
          - [ ] Report generated successfully

          ## Sources

          - CoinPaprika
          - Frankfurter
          - Open-Meteo
          - World Bank

          EOF
          )"