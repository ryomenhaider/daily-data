name: Daily Intelligence Pipeline

on:
  schedule:
    # 08:00 PKT
    - cron: "0 3 * * *"

    # 14:00 PKT
    - cron: "0 9 * * *"

    # 20:00 PKT
    - cron: "0 15 * * *"

  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: daily-intelligence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Configure Python path
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      - name: Configure Git
        run: |
          git config user.name "rankistan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate run ID
        id: run
        run: |
          RUN_ID="$(date -u '+%Y-%m-%d-%H-%M-%S')"
          BRANCH="automation/run/${RUN_ID}"

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          echo "RUN_ID=${RUN_ID}"
          echo "BRANCH=${BRANCH}"

      - name: Create run branch
        run: |
          git checkout -b "${{ steps.run.outputs.branch }}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run pipeline
        run: |
          python -m src.daily_pipeline

      - name: Validate generated data
        run: |
          python -m pytest -q

      - name: Show commits
        run: |
          git log --oneline -15

      - name: Push branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --set-upstream origin "${{ steps.run.outputs.branch }}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          BRANCH="${{ steps.run.outputs.branch }}"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "data: intelligence pipeline ${RUN_ID}" \
            --body "Automated intelligence pipeline run ${RUN_ID}.

          Sources:
          - CoinPaprika
          - Frankfurter
          - Open-Meteo
          - World Bank

          Generated:
          - cryptocurrency snapshot
          - FX snapshot
          - weather snapshot
          - macroeconomic snapshot
          - crypto features
          - FX features
          - weather features
          - combined feature set
          - intelligence report
          - pipeline metadata"

      - name: Create data quality issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "data: quality review ${RUN_ID}" \
            --body "Automated data quality review for pipeline run ${RUN_ID}.

          - [ ] Cryptocurrency data valid
          - [ ] FX data valid
          - [ ] Weather data valid
          - [ ] Macro data valid
          - [ ] No unexpected null values
          - [ ] Features valid
          - [ ] Report generated"